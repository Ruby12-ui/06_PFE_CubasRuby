<div class="pelicula-card">

  <img
    class="pelicula-imagen"
    [src]="pelicula.imagen"
    [alt]="pelicula.titulo"
  >

  <div class="pelicula-contenido">

    <h2>{{ pelicula.titulo }}</h2>

    <p class="genero">
      {{ pelicula.genero }}
    </p>

    <div class="informacion">
      <p>
        <strong>Director:</strong>
        {{ pelicula.director }}
      </p>

      <p>
        <strong>Año:</strong>
        {{ pelicula.anio }}
      </p>

      <p>
        <strong>Duración:</strong>
        {{ pelicula.duracion }} minutos
      </p>
    </div>

    <p class="descripcion">
      {{ pelicula.descripcion }}
    </p>

    <div class="acciones">

      <button
        class="btn-editar"
        [routerLink]="['/peliculas/editar', pelicula.id]">
        Editar
      </button>

      <button
        class="btn-eliminar"
        (click)="eliminarPelicula()">
        Eliminar
      </button>

    </div>

  </div>

</div>
