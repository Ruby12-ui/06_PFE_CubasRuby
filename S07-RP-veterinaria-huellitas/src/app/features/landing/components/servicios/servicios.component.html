<section id="servicios" class="servicios">

  <div class="section-title">

    <span>¿Qué hacemos?</span>

    <h2>
      Nuestros servicios
    </h2>

    <p>
      Todo lo que tu mascota necesita en un solo lugar.
    </p>

  </div>

  <div class="cards">

    @for (servicio of servicios; track servicio.nombre) {

      <article class="card">

        <div class="icon">
          {{ servicio.icono }}
        </div>

        <h3>
          {{ servicio.nombre }}
        </h3>

        <p>
          {{ servicio.descripcion }}
        </p>

        <a href="#contacto">
          Más información →
        </a>

      </article>

    }

  </div>

</section>
