<section id="especialistas" class="especialistas">

  <div class="section-title">

    <span>Nuestro equipo</span>

    <h2>
      Especialistas que aman a los animales
    </h2>

  </div>

  <div class="especialistas-grid">

    @for (especialista of especialistas; track especialista.nombre) {

      <article class="especialista-card">

        <div class="doctor">
          {{ especialista.icono }}
        </div>

        <h3>
          {{ especialista.nombre }}
        </h3>

        <p>
          {{ especialista.especialidad }}
        </p>

      </article>

    }

  </div>

</section>
